name: Dependency Review

# Runs on every PR to check for new dependencies with known vulnerabilities.
# Requires Dependency Graph enabled in repo Settings → Security & analysis.
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
