name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    defaults:
      run:
        shell: bash   # one shell on every OS (Git Bash on Windows), so steps behave alike

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify imports
        run: |
          python -c "import flask; from importlib.metadata import version; print('Flask', version('flask'))"
          python -c "import waitress; print('Waitress OK')"
          python -c "from pathlib import Path; print('Pathlib OK')"

      - name: Check for syntax errors
        run: |
          python -m py_compile server.py
          python -m py_compile desktop.py

      # server.py only calls serve() under __main__, so importing it never binds a
      # port. The import runs every module-level side effect (data dirs, routes) and a
      # health request through the test client proves the app actually answers.
      # server.py mkdirs subfolders of VIDCOL_DATA_DIR at import, so it must exist first.
      - name: Verify server starts
        timeout-minutes: 2
        env:
          VIDCOL_DATA_DIR: ${{ runner.temp }}/vcdata-import
        run: |
          python -c 'import os; os.makedirs(os.environ["VIDCOL_DATA_DIR"], exist_ok=True)'
          python - <<'PY'
          import server
          res = server.app.test_client().get("/api/health")
          assert res.status_code == 200, f"/api/health returned {res.status_code}"
          print("server.py imported; /api/health ->", res.status_code, res.get_json()["status"])
          PY

      - name: Run test suite
        timeout-minutes: 10
        env:
          VIDCOL_DATA_DIR: ${{ runner.temp }}/vcdata
        run: |
          python -c 'import os; os.makedirs(os.environ["VIDCOL_DATA_DIR"], exist_ok=True)'
          python -m pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install safety
        run: pip install safety pip-audit

      - name: Check for known vulnerabilities (pip-audit)
        run: |
          pip install -r requirements.txt
          pip-audit --strict --requirement requirements.txt

      # Matches secret VALUE shapes, not variable names: GEMINI_API_KEY in code is fine,
      # a pasted key is not. Every tracked file is scanned byte-for-byte, which covers
      # ASCII and UTF-8 text and the ASCII inside binaries. The rules are ASCII, so text
      # stored in 16/32-bit units (a PowerShell 5.1 `>` redirect, a .reg export) hides a
      # key from that pass. So a file that starts with a UTF-16/UTF-32 BOM is also decoded
      # and scanned; if it doesn't decode, the log names it and it is treated as binary.
      # Any other file (or an undecodable one) containing NUL bytes is also scanned with
      # the NULs removed, which exposes BOM-less UTF-16/32 ASCII text. Not covered:
      # compressed or encoded content (a zip, a base64 blob). A hit prints file:line and
      # the rule only, never the match, so the log doesn't re-leak it.
      - name: Scan for secrets
        shell: python
        run: |
          import codecs, os, re, subprocess, sys

          RULES = [
              ("Google API key", r"AIza[0-9A-Za-z_-]{35}"),
              ("OpenAI/Anthropic-style key",
               r"(?<![A-Za-z0-9])sk-(?:(?:proj|ant|svcacct|admin)-[A-Za-z0-9_-]{20,}|[A-Za-z0-9]{20,})"),
              ("GitHub token", r"gh[pousr]_[A-Za-z0-9]{36}"),
              ("GitHub fine-grained token", r"github_pat_[A-Za-z0-9_]{22,}"),
              ("AWS access key id", r"(?<![A-Z0-9])(?:AKIA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])"),
              ("Slack token", r"xox[baprs]-[0-9A-Za-z-]{10,}"),
              ("private key block", r"-----BEGIN [A-Z ]*PRIVATE KEY"),
          ]
          RULES = [(name, re.compile(rx)) for name, rx in RULES]
          # UTF-32-LE's BOM starts with UTF-16-LE's, so the 32-bit codecs are tried first.
          BOMS = [(codecs.BOM_UTF32_LE, "utf-32"), (codecs.BOM_UTF32_BE, "utf-32"),
                  (codecs.BOM_UTF16_LE, "utf-16"), (codecs.BOM_UTF16_BE, "utf-16")]

          def views(path, data):
              """(label, text) passes for one file: raw bytes, then its decoded text."""
              yield "", data.decode("latin-1")         # byte-for-byte: text and binaries
              codecs_tried = [c for bom, c in BOMS if data.startswith(bom)]
              for codec in codecs_tried:
                  try:
                      yield f" ({codec})", data.decode(codec)
                      return
                  except UnicodeDecodeError:
                      continue
              if codecs_tried:
                  print(f"{path}: starts with a UTF-16/32 BOM but does not decode; "
                        "skipping the decoded scan, treating it as binary")
              if b"\0" in data:                          # BOM-less UTF-16/32, binaries
                  yield " (NULs removed)", data.replace(b"\0", b"").decode("latin-1")

          tracked = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                   check=True).stdout.split(b"\0")
          scanned, found = 0, set()
          for raw in filter(None, tracked):
              if not os.path.isfile(raw):      # submodule gitlink: no content here
                  continue
              with open(raw, "rb") as fh:
                  data = fh.read()
              scanned += 1
              path = raw.decode("utf-8", "replace")
              for label, text in views(path, data):
                  for lineno, line in enumerate(text.split("\n"), 1):
                      for name, rx in RULES:
                          if (path, lineno, name) not in found and rx.search(line):
                              found.add((path, lineno, name))
                              print(f"{path}:{lineno}: possible {name}{label}")

          if found:
              print(f"::error::{len(found)} secret-shaped value(s) in tracked files. "
                    "Remove them AND rotate the keys - git history still has them.")
              sys.exit(1)
          print(f"No secret-shaped values in {scanned} tracked files.")
